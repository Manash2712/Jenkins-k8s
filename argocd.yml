# 🐙 How Argo CD Works

**Argo CD is a declarative, GitOps continuous delivery tool for Kubernetes.** It acts as a controller inside your cluster that constantly answers one question: *"Does my live infrastructure match the configuration files stored in Git?"*

Here is a step-by-step breakdown of exactly how it operates.

---

### 🏛️ The Three-Step Architecture

Argo CD functions by managing two separate data points and keeping them perfectly aligned.

```mermaid
graph LR
    Git[(Git Repository<br>Target State)] 
    -->|1. Polling / Webhook| Argo[Argo CD Controller]
    K8s[(K8s Cluster<br>Live State)] 
    -->|2. Monitoring| Argo
    Argo -->|3. Reconciliation| K8s
```

#### 1. Tracking the Target State (Git)
You store your raw Kubernetes configurations (YAML manifests, Helm charts, or Kustomize templates) in a Git repository. This repository represents your **Target State** (what you *want* your environment to look like).

#### 2. Monitoring the Live State (Kubernetes)
Argo CD runs directly inside your Kubernetes cluster. It uses the native Kubernetes API to continuously monitor all running pods, services, deployments, and ingress rules. This is your **Live State** (what is *actually* running).

#### 3. Continuous Reconciliation (The Loop)
Argo CD continuously runs a background loop comparing these two states:
* **Synced Status**: If the code in Git matches the cluster, the system is marked as `Synced`.
* **OutOfSync Status**: If they do not match, Argo CD instantly marks the application as `OutOfSync`.

---

### 🔄 Handling Application Synchronization

When a mismatch is detected, Argo CD rectifies it depending on how you configured its settings.

#### Manual Sync Mode
Argo CD flags the system as `OutOfSync` and alerts you via its dashboard, CLI, or Slack notifications. It provides a visual **Diff** (a color-coded breakdown of exactly what line of code changed). A human must click the **Sync** button to apply the changes to production.

#### Automated Sync Mode (True GitOps)
If Auto-Sync is turned on, Argo CD bypasses human manual intervention. The moment a modification is pushed to the Git repository, the controller triggers a reconciliation event, pulling down the changes and updating the Kubernetes cluster in real-time.

---

### 🛡️ Preventing Configuration Drift (Self-Healing)

One of Argo CD's greatest advantages is protecting clusters from external interference or manual overrides (often called **Configuration Drift**).

```text
               [ Engineer runs: kubectl edit deployment ]
                                 │
                                 ▼
┌─────────────────────────────────────────────────────────────────┐
│                    AMAZON EKS / KUBERNETES                      │
│                                                                 │
│  ┌─────────────────────────┐       ┌─────────────────────────┐  │
│  │   Argo CD Controller    ├──────►│   Application Pods      │  │
│  │                         │       │                         │  │
│  │  1. Detects manual diff │       │  3. Overwrites change,  │  │
│  │  2. Pulls Git source    │       │     reverts to safe code│  │
│  └─────────────────────────┘       └─────────────────────────┘  │
└─────────────────────────────────────────────────────────────────┘
```

If a system administrator bypasses the Git repository and executes a direct manual command in production (e.g., `kubectl edit deployment vprofile-app`), Argo CD spots the anomaly immediately. 

If **Self-Healing** is enabled, Argo CD treats the manual command as an unauthorized error. It will instantly re-apply the configuration from Git, overriding the manual modification and restoring stability to your production application automatically.

---

### ⚙️ How Argo CD Integrates with Your Pipeline

In a modern CI/CD architecture, Argo CD fundamentally shifts the delivery pipeline model from a **Push** system to a **Pull** system:

* **Traditional CI/CD (Push)**: Jenkins or GitHub Actions holds secret administrative credentials to your cluster, logging in via SSH or API to force code changes onto Kubernetes. If your CI engine is breached, your cluster is compromised.
* **Argo CD GitOps (Pull)**: Your CI runner only builds and packages the application image, pushes it to a container registry, and modifies a version tag in Git. Argo CD safely inside the cluster pulls down those changes, meaning **no external system ever needs direct access to your infrastructure.**
